# CHCars — modèle de site nginx (reverse proxy du serveur, devant la stack
# docker compose). Un site par environnement : préprod et prod tournent sur le
# même serveur, chacune avec ses ports, son domaine et ses noms d'upstream
# (nginx refuse deux upstream du même nom).
#
# Une origine unique : /api et /uploads → back, le reste → front (le front est
# construit avec NEXT_PUBLIC_API_URL=/api). Les conteneurs n'écoutent que sur
# 127.0.0.1, sur les ports FRONT_PORT / BACK_PORT du .env de l'environnement.
#
# Marqueurs à remplacer (voir README § « CI/CD et déploiement ») :
#   @ENV@         prod | preprod           (noms des upstream)
#   @DOMAIN@      chcars.fr | preprod.chcars.fr
#   @FRONT_PORT@  3010 | 3013              (= FRONT_PORT du .env)
#   @BACK_PORT@   3011 | 3014              (= BACK_PORT du .env)
#
# Puis : activer le site, `sudo nginx -t && sudo systemctl reload nginx`, et
# `sudo certbot --nginx -d @DOMAIN@ --redirect` — certbot ajoute « listen 443
# ssl », le certificat Let's Encrypt et la redirection 80 → 443 ; le
# renouvellement est automatique.

upstream chcars_@ENV@_front {
    server 127.0.0.1:@FRONT_PORT@;
    keepalive 16;
}

upstream chcars_@ENV@_back {
    server 127.0.0.1:@BACK_PORT@;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    server_tokens off;

    # Photos d'annonces : uploads jusqu'à 15 Mo (MAX_UPLOAD_BYTES) — nginx
    # refuse tout corps > 1 Mo par défaut.
    client_max_body_size 16m;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Écrasé (pas complété) : l'API fait confiance à un seul proxy
    # (TRUST_PROXY=1) et lit l'IP client ici — rate limiting fiable, non
    # falsifiable via un X-Forwarded-For envoyé par le client.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location /api/ {
        proxy_pass http://chcars_@ENV@_back;
    }

    location /uploads/ {
        proxy_pass http://chcars_@ENV@_back;
    }

    location / {
        proxy_pass http://chcars_@ENV@_front;
    }
}
